# Full-chain e2e stack: the pays (Brazil) and the siège on one network, so the
# siège reaches the pays by service name (http://pays:8000) during sync.
#
# The gateway and fake sensor run on the HOST (they need a pseudo-terminal), and
# publish to the broker through the exposed 1883 port. The frontend also runs on
# the host (next start), pointed at the siège via the exposed 8080 port.

name: futurekawa-e2e

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ../backend-local/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${E2E_BROKER_PORT:-1883}:1883"

  mailpit:
    image: axllent/mailpit:latest
    # SMTP (1025) stays internal — the pays reaches it by service name. Only the
    # REST API (8025) is published so the e2e can assert on captured mail.
    ports:
      - "${E2E_MAILPIT_PORT:-8025}:8025"

  pays:
    build: ../backend-local
    depends_on:
      - mosquitto
      - mailpit
    environment:
      COUNTRY: br
      API_KEY: e2e-secret
      DATABASE_URL: sqlite:////data/backend-local.db
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: backend-local-br
      EXPIRY_CHECK_INTERVAL_S: "3600"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_FROM: alertes@futurekawa.local
      ALERT_RECIPIENT: responsable-br@futurekawa.local
      SEED_DEMO: "true"
    ports:
      - "${E2E_PAYS_PORT:-8000}:8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: futurekawa_siege
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d futurekawa_siege"]
      interval: 3s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ../backend-siege
      dockerfile: docker/php/Dockerfile
    # The named volume is populated from the image (code + vendor baked at build)
    # on first mount, then shared read-only with nginx below.
    volumes:
      - siege_app:/var/www/app
    environment:
      APP_ENV: prod
      APP_SECRET: e2e_secret_at_least_32_characters_long
      DATABASE_URL: postgresql://app:password@db:5432/futurekawa_siege?serverVersion=16&charset=utf8
      MAILER_DSN: "null://null"
      MESSENGER_TRANSPORT_DSN: "sync://"
      # Wire Brazil's sync URL/key so the fixtures configure a pullable country.
      PAYS_BR_API_URL: http://pays:8000
      PAYS_BR_API_KEY: e2e-secret
    command: php-fpm
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${E2E_SIEGE_PORT:-8080}:80"
    volumes:
      - siege_app:/var/www/app:ro
      - ../backend-siege/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  siege_app:
