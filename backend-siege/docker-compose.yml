services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/app
      - ./config/jwt:/var/www/app/config/jwt:ro
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-futurekawa_siege}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /var/www/app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/app/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      ALERT_TEMP_TOLERANCE: ${ALERT_TEMP_TOLERANCE:-3}
      ALERT_HUMIDITY_TOLERANCE: ${ALERT_HUMIDITY_TOLERANCE:-2}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futurekawa_siege}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-futurekawa_siege}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/console messenger:consume scheduler_default --time-limit=3600
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-futurekawa_siege}?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /var/www/app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/app/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      ALERT_TEMP_TOLERANCE: ${ALERT_TEMP_TOLERANCE:-3}
      ALERT_HUMIDITY_TOLERANCE: ${ALERT_HUMIDITY_TOLERANCE:-2}
    volumes:
      - .:/var/www/app
      - ./config/jwt:/var/www/app/config/jwt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
