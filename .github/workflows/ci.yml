name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which component changed so a frontend-only PR does not run the PHP
  # tests, and vice versa. On a push to main every path is forced so the record
  # of a merge always shows the full matrix.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend-siege: ${{ steps.filter.outputs.backend-siege }}
      backend-local: ${{ steps.filter.outputs.backend-local }}
      iot: ${{ steps.filter.outputs.iot }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-siege:
              - 'backend-siege/**'
            backend-local:
              - 'backend-local/**'
            iot:
              - 'iot/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              - 'backend-siege/**'
              - 'backend-local/**'
              - 'frontend/**'
              - 'iot/**'

  backend-siege:
    needs: changes
    if: needs.changes.outputs.backend-siege == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-siege
    services:
      postgres:
        # The test env appends a `_test` suffix (doctrine.yaml when@test), so the
        # effective database is futurekawa_siege + _test. That is the name the
        # service must create for the connection to resolve.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: futurekawa_siege_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      # Base name without the suffix; doctrine appends _test in the test env.
      DATABASE_URL: postgresql://app:password@127.0.0.1:5432/futurekawa_siege?serverVersion=16
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend-siege/vendor
          key: composer-${{ hashFiles('backend-siege/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --prefer-dist
      # No migrate/fixtures here: the integration tests drop and recreate the
      # schema themselves (tests/Integration/Controller/ApiTestCase.php) and
      # assume a virgin database. Strict PHPUnit fails on any deprecation.
      - run: php bin/phpunit

  backend-local:
    needs: changes
    if: needs.changes.outputs.backend-local == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-local/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  iot:
    needs: changes
    if: needs.changes.outputs.iot == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      # Verify the firmware still compiles for the UNO, without a board.
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "DHT sensor library"
          arduino-cli compile --fqbn arduino:avr:uno firmware/futurekawa_sensor

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # Full-chain test: fake sensor -> gateway -> broker -> pays -> siege -> frontend.
  # Runs after the four component jobs so a broken unit does not waste an e2e run.
  e2e:
    needs: [changes, backend-siege, backend-local, iot, frontend]
    if: |
      always() && !cancelled() && !failure()
      && (needs.changes.outputs.e2e == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install e2e deps
        run: |
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      # The suite owns the whole lifecycle: it builds and boots the Docker stacks,
      # builds and serves the frontend, runs the gateway on a fake sensor, and
      # tears everything down (e2e/conftest.py).
      - name: Run e2e suite
        run: pytest e2e/ -v

  # Single required status check for branch protection. Path-filtered jobs may be
  # skipped; this gate is green only when nothing that ran actually failed.
  ci:
    needs: [backend-siege, backend-local, iot, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ needs.backend-siege.result }} ${{ needs.backend-local.result }} ${{ needs.iot.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }}'
          echo "results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "All triggered jobs passed."
